name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches manifest.json
        run: |
          version=$(python3 -c "import json;print(json.load(open('custom_components/bonbon/manifest.json'))['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - name: Build bonbon.zip
        run: |
          python3 scripts/build.py
          unzip -l bonbon.zip

      - name: Take the notes from CHANGELOG.md
        run: |
          python3 - <<'EOF' > release-notes.md
          import json, pathlib, re
          version = json.loads(
              pathlib.Path("custom_components/bonbon/manifest.json").read_text()
          )["version"]
          text = pathlib.Path("CHANGELOG.md").read_text()
          match = re.search(
              rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## |\Z)", text, re.M | re.S
          )
          print(match.group(1).strip() if match else f"Bonbon {version}")
          EOF
          head -5 release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: bonbon.zip
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
